<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><defs><pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="8" r=".6" fill="#978769" opacity=".23"/></pattern><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#487a87"/><stop offset="1" stop-color="#e7dbc2"/></linearGradient></defs><rect width="800" height="500" fill="#f2ead8"/><rect x="18" y="18" width="764" height="464" rx="12" fill="url(#sky)"/><path d="M18 350 Q210 315 400 354 T782 345 V482 H18Z" fill="#4b5551" opacity=".5"/><rect x="145" y="48" width="505" height="325" rx="5" fill="#f8efd9" stroke="#a79573" stroke-width="3"/><g font-family="Georgia, serif" fill="#493f30"><text x="170" y="90" font-size="22">ПРОТОКОЛ · 2/5</text><text x="170" y="123" font-size="16">Радиорубка опечатана в 22:10. На пути</text><text x="170" y="146" font-size="16">обнаружены волокна складского каната; смена</text><text x="170" y="169" font-size="16">кассеты должна занять не больше восьми минут</text><text x="170" y="192" font-size="16">пути. Причал ↔ Радиорубка: 4 мин. Радиорубка ↔</text><text x="170" y="215" font-size="16">Башня: 6 мин. Причал ↔ Склад: 3 мин. Склад ↔</text><text x="170" y="238" font-size="16">Башня: 4 мин. Склад ↔ Мастерская: 2 мин.</text></g><circle cx="690" cy="325" r="40" fill="none" stroke="#9a6f58" stroke-width="3"/><rect width="800" height="500" fill="url(#grain)"/><rect x="18" y="390" width="764" height="92" fill="#f7f0df" opacity=".97"/><g fill="#342e25" font-family="Georgia, serif"><text x="42" y="425" font-size="25">Путь между постами</text><text x="42" y="467" font-size="15">Полный текст приведён в материалах дела</text></g><rect x="18" y="18" width="764" height="464" rx="12" fill="none" stroke="#6e6049" stroke-width="2"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"><defs><pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="8" r=".6" fill="#978769" opacity=".23"/></pattern><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#78618a"/><stop offset="1" stop-color="#e7dbc2"/></linearGradient></defs><rect width="800" height="500" fill="#f2ead8"/><rect x="18" y="18" width="764" height="464" rx="12" fill="url(#sky)"/><path d="M18 350 Q210 315 400 354 T782 345 V482 H18Z" fill="#4b5551" opacity=".5"/><rect x="145" y="48" width="505" height="325" rx="5" fill="#f8efd9" stroke="#a79573" stroke-width="3"/><g font-family="Georgia, serif" fill="#493f30"><text x="170" y="90" font-size="22">ПРОТОКОЛ · 9/8</text><text x="170" y="123" font-size="16">Тамара Эхо: помещение «Коридор». Богдан Луч:</text><text x="170" y="146" font-size="16">помещение «Студия». Эрик Шум: помещение</text><text x="170" y="169" font-size="16">«Аппаратная». Инга Лад: помещение</text><text x="170" y="192" font-size="16">«Передатчик». Лука Волин: помещение «Архив</text><text x="170" y="215" font-size="16">лент». Богдан Луч стоит рядом с предметом</text><text x="170" y="238" font-size="16">«Окно» по стороне клетки в той же комнате.</text><text x="170" y="261" font-size="16">Эрик Шум севернее, чем Богдан Луч. Тамара Эхо</text><text x="170" y="284" font-size="16">не находится в помещении «Передатчик».</text></g><circle cx="690" cy="325" r="40" fill="none" stroke="#9a6f58" stroke-width="3"/><rect width="800" height="500" fill="url(#grain)"/><rect x="18" y="390" width="764" height="92" fill="#f7f0df" opacity=".97"/><g fill="#342e25" font-family="Georgia, serif"><text x="42" y="425" font-size="25">Контрольный снимок</text><text x="42" y="467" font-size="15">Полный текст приведён в материалах дела</text></g><rect x="18" y="18" width="764" height="464" rx="12" fill="none" stroke="#6e6049" stroke-width="2"/></svg>